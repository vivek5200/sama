name: ITSM image CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "spaces/sama-itsm-demo/**"
      - "sama/**"
      - "pyproject.toml"
      - ".github/workflows/itsm-image-deploy.yml"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "spaces/sama-itsm-demo/**"
      - "sama/**"
      - "pyproject.toml"
      - ".github/workflows/itsm-image-deploy.yml"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: sama-itsm-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/vivek5200/sama-itsm-demo

jobs:
  test:
    name: Run Python tests
    uses: ./.github/workflows/test.yml

  build-image:
    name: Build ARM64 image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish on main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./spaces/sama-itsm-demo/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=itsm-arm64
          cache-to: type=gha,mode=max,scope=itsm-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/vivek5200/sama
            org.opencontainers.image.revision=${{ github.sha }}

