services:
  sama-itsm:
    image: ghcr.io/vivek5200/sama-itsm-demo:latest
    platform: linux/arm64
    container_name: sama-itsm
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - hf-cache:/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20m

volumes:
  hf-cache:
